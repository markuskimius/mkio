<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mkio Order Book</title>
  <script src="/mkio.js"></script>
  <script type="module" src="/mkio-expr.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; background: #0f172a; color: #e2e8f0; }
    h1, h2 { color: #f1f5f9; }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    th, td { border: 1px solid #334155; padding: 8px; text-align: left; }
    th { background: #1e293b; color: #94a3b8; font-weight: 600; }
    tr:hover { background: #1e293b; }
    form { display: flex; gap: 0.5rem; margin: 1rem 0; flex-wrap: wrap; }
    input, select { padding: 6px 10px; border: 1px solid #475569; border-radius: 4px; background: #1e293b; color: #e2e8f0; font-size: inherit; }
    input::placeholder { color: #64748b; }
    button { padding: 6px 14px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 0.8rem; }
    button:hover { background: #3b82f6; }
    #status { padding: 4px 8px; border-radius: 4px; font-size: 0.875rem; }
    .connected { background: #064e3b; color: #6ee7b7; }
    .disconnected { background: #450a0a; color: #fca5a5; }
    .side-buy { color: #60a5fa; font-weight: 600; }
    .side-sell { color: #f87171; font-weight: 600; }
    .status-pending { color: #fbbf24; }
    .status-accepted { color: #34d399; }
    .status-filled { color: #60a5fa; }
    .status-rejected { color: #f87171; }
    .status-cancelled { color: #94a3b8; }
    .actions { white-space: nowrap; width: 1%; }
    .actions button { padding: 3px 8px; margin: 0 2px; font-size: 0.75rem; }
    .btn-accept { background: #059669; }
    .btn-accept:hover { background: #10b981; }
    .btn-fill { background: #2563eb; }
    .btn-fill:hover { background: #3b82f6; }
    .btn-reject { background: #dc2626; }
    .btn-reject:hover { background: #ef4444; }
    .btn-cancel { background: #6b7280; }
    .btn-cancel:hover { background: #9ca3af; }
    .btn-place { font-size: inherit; }
    #errors { position: fixed; top: 1rem; right: 1rem; z-index: 100; max-width: 400px; }
    .error-toast { background: #7f1d1d; color: #fca5a5; border: 1px solid #dc2626; border-radius: 6px; padding: 10px 14px; margin-bottom: 8px; font-size: 0.875rem; animation: fadeIn 0.2s; cursor: pointer; }
    .error-toast:hover { background: #991b1b; }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

    /* Login overlay */
    #login-overlay { position: fixed; inset: 0; background: #0f172a; display: flex; align-items: center; justify-content: center; z-index: 200; }
    #login-box { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 2rem; width: 320px; }
    #login-box h2 { margin-top: 0; text-align: center; }
    #login-box form { flex-direction: column; }
    #login-box input { width: 100%; box-sizing: border-box; }
    #login-box button { width: 100%; padding: 10px; font-size: 1rem; }
    #login-error { color: #fca5a5; font-size: 0.875rem; margin-top: 0.5rem; min-height: 1.25rem; }
    .user-bar { display: flex; align-items: center; gap: 1rem; }
    .user-bar .role { color: #94a3b8; font-size: 0.875rem; }
    .btn-logout { background: #475569; font-size: 0.75rem; padding: 3px 10px; }
    .btn-logout:hover { background: #64748b; }
    #app { display: none; }
  </style>
</head>
<body>
  <div id="errors"></div>

  <!-- Login overlay -->
  <div id="login-overlay">
    <div id="login-box">
      <h2>Order Book</h2>
      <form id="login-form">
        <input name="username" placeholder="Username" required autocomplete="username">
        <input name="password" type="password" placeholder="Password" required autocomplete="current-password">
        <button type="submit">Log In</button>
      </form>
      <div id="login-error"></div>
      <div style="margin-top: 1rem; color: #64748b; font-size: 0.8rem;">
        <div style="margin-bottom: 0.25rem;">Demo accounts (password is <strong style="color:#94a3b8">password</strong>):</div>
        <div><strong style="color:#94a3b8">alice</strong> — trader role</div>
        <div><strong style="color:#94a3b8">bob</strong> — viewer role</div>
      </div>
    </div>
  </div>

  <!-- Main app (hidden until authenticated) -->
  <div id="app">
    <h1>Order Book</h1>
    <div class="user-bar">
      <span>Status: <span id="status" class="disconnected">Disconnected</span></span>
      <span>User: <strong id="user-name"></strong> <span class="role" id="user-role"></span></span>
      <button class="btn-logout" onclick="logout()">Log Out</button>
    </div>

    <div id="trade-section">
      <h2>Place Order</h2>
      <form id="order-form">
        <select name="side" required onchange="this.className = this.value === 'Buy' ? 'side-buy' : this.value === 'Sell' ? 'side-sell' : ''">
          <option value="">Side</option>
          <option value="Buy">Buy</option>
          <option value="Sell">Sell</option>
        </select>
        <input name="symbol" placeholder="Symbol" required autocomplete="off">
        <input name="qty" type="number" placeholder="Qty" required autocomplete="off">
        <input name="price" type="number" step="0.01" placeholder="Price" required autocomplete="off">
        <button class="btn-place" type="submit">Place Order</button>
      </form>
    </div>

    <h2>Live Orders</h2>
    <table>
      <thead>
        <tr><th>ID</th><th>Side</th><th>Symbol</th><th>Qty</th><th>Price</th><th>Status</th><th id="actions-header">Actions</th></tr>
      </thead>
      <tbody id="orders-body"></tbody>
    </table>
  </div>

  <script>
    const errorsEl = document.getElementById('errors');
    function showError(msg) {
      const el = document.createElement('div');
      el.className = 'error-toast';
      el.textContent = msg;
      el.onclick = () => el.remove();
      errorsEl.appendChild(el);
      setTimeout(() => el.remove(), 8000);
    }

    let currentUser = null;
    const statusEl = document.getElementById('status');
    const client = new MkioClient(`ws://${location.host}/ws`, {
      onConnect() {
        statusEl.textContent = 'Connected';
        statusEl.className = 'connected';
      },
      onDisconnect() {
        statusEl.textContent = 'Disconnected';
        statusEl.className = 'disconnected';
      },
    });
    const ordersMap = new Map();
    const tbody = document.getElementById('orders-body');

    const STATUS_ACTIONS = {
      pending:   ['accept', 'reject', 'cancel'],
      accepted:  ['fill', 'cancel'],
      filled:    [],
      rejected:  [],
      cancelled: [],
    };

    function renderOrders() {
      tbody.innerHTML = '';
      for (const row of ordersMap.values()) {
        const tr = document.createElement('tr');
        const sideClass = row.side === 'Buy' ? 'side-buy' : 'side-sell';
        const statusClass = 'status-' + (row.status || '').toLowerCase();
        const actions = STATUS_ACTIONS[row.status] || [];
        const actionButtons = actions.map(a =>
          `<button class="btn-${a}" onclick="doAction(${row.id}, '${a}')">${a[0].toUpperCase() + a.slice(1)}</button>`
        ).join('');
        tr.innerHTML = `<td>${row.id}</td><td class="${sideClass}">${row.side}</td><td>${row.symbol}</td><td>${row.qty}</td><td>${row.price}</td><td class="${statusClass}">${row.status}</td><td class="actions">${actionButtons}</td>`;
        tbody.appendChild(tr);
      }
    }

    async function doAction(id, action) {
      try {
        const result = await client.send('orders', { id }, { op: action });
        if (result.type === 'error') showError(result.message || 'Action failed');
      } catch (e) {
        showError(e.message || 'Action failed');
      }
    }

    function subscribeToOrders() {
      client.subscribe('all_orders', 'query', {
        onSnapshot(rows) {
          ordersMap.clear();
          rows.forEach(r => ordersMap.set(r.id, r));
          renderOrders();
        },
        onDelta(changes) {
          changes.forEach(c => {
            if (c.op === 'delete') ordersMap.delete(c.row.id);
            else ordersMap.set(c.row.id, c.row);
          });
          renderOrders();
        },
        onUpdate(op, row) {
          if (op === 'delete') ordersMap.delete(row.id);
          else ordersMap.set(row.id, row);
          renderOrders();
        },
        onNack(msg) {
          showError('Orders: ' + msg);
        },
      });
    }

    // --- Login ---

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const errorEl = document.getElementById('login-error');
      errorEl.textContent = '';

      try {
        await client.connect();
        const result = await client.auth({
          username: form.username.value,
          password: form.password.value,
        });
        currentUser = { user: result.user, role: result.role };

        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        document.getElementById('user-name').textContent = currentUser.user;
        document.getElementById('user-role').textContent = `(${currentUser.role})`;

        // Show/hide trade UI based on role having trade right
        // (We don't know rights client-side, but we can try and handle nack)
        subscribeToOrders();
      } catch (err) {
        errorEl.textContent = err.message || 'Login failed';
        client.close();
        client._closed = false;
        client._authData = null;
      }
    });

    function logout() {
      client.close();
      currentUser = null;
      ordersMap.clear();
      tbody.innerHTML = '';
      document.getElementById('app').style.display = 'none';
      document.getElementById('login-overlay').style.display = 'flex';
      document.getElementById('login-error').textContent = '';
      document.getElementById('login-form').reset();
      // Recreate client internals for next login
      client._closed = false;
      client._authData = null;
      client._subscriptions.clear();
      client._pending.clear();
    }

    document.getElementById('order-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const data = {
        side: form.side.value,
        symbol: form.symbol.value,
        qty: parseInt(form.qty.value),
        price: parseFloat(form.price.value),
      };
      try {
        const result = await client.send('orders', data, { op: 'new' });
        if (result.type === 'error') {
          showError(result.message || 'Order failed');
          return;
        }
        form.reset();
        form.side.className = '';
      } catch (e) {
        showError(e.message || 'Order failed');
      }
    });
  </script>
</body>
</html>
