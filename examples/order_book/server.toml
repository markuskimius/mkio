port = 8080
host = "0.0.0.0"
db_path = "orders.db"
batch_max_size = 500
batch_max_wait_ms = 2.0
auto_migrate = "safe"
monitor_access = "trade"

# --- Database schema ---

[tables.orders]
columns = { id = "INTEGER PRIMARY KEY AUTOINCREMENT", side = "TEXT NOT NULL", symbol = "TEXT NOT NULL", qty = "INTEGER", price = "REAL DEFAULT 0", status = "TEXT DEFAULT 'pending'" }
# Record every version of every row in orders__history, stamped with the
# ref, the authenticated user and the service it came through. Rows gain a
# _mkio_version counter: 1 on insert, +1 on every edit. The undo/redo ops below
# move a row back and forth along its recorded versions.
versioned = true

# audit_log is hand-rolled and still worth having: it records application
# *events* ("accepted", "filled") through a second op in the same transaction,
# which is what the `bind` references below demonstrate. The history table is a
# different thing — it captures the whole row on every change, automatically,
# and is what the undo and audit-trail services below are built on.
[tables.audit_log]
columns = { id = "INTEGER PRIMARY KEY AUTOINCREMENT", event = "TEXT", order_id = "INTEGER", status = "TEXT" }

# --- Authentication ---
# Presence of _mkio_rights enables auth; all services locked by default.
# Default users seeded on first run: alice/password (trader), bob/password (viewer)
# Add more users with: mkio adduser <username> <role>

[tables._mkio_users]
columns = { username = "TEXT PRIMARY KEY", password = "TEXT NOT NULL", role = "TEXT NOT NULL" }
seed = "data/users.csv"

[tables._mkio_rights]
columns = { role = "TEXT", right = "TEXT" }
seed = "data/rights.csv"

# --- Transaction service (all order operations at one endpoint) ---

[services.orders]
protocol = "transaction"
access = "trade"

[services.orders.ops]
new = [
    { table = "orders", op_type = "insert", fields = ["side", "symbol", "qty", "price"] },
    { table = "audit_log", op_type = "insert", defaults = { event = "new" }, bind = { order_id = "$0.id", status = "$0.status" } },
]
accept = [
    { table = "orders", op_type = "update", key = ["id"], fields = ["status"], defaults = { status = "accepted" } },
    { table = "audit_log", op_type = "insert", defaults = { event = "accepted" }, bind = { order_id = "$0.id", status = "$0.status" } },
]
reject = [
    { table = "orders", op_type = "update", key = ["id"], fields = ["status"], defaults = { status = "rejected" } },
    { table = "audit_log", op_type = "insert", defaults = { event = "rejected" }, bind = { order_id = "$0.id", status = "$0.status" } },
]
fill = [
    { table = "orders", op_type = "update", key = ["id"], fields = ["status"], defaults = { status = "filled" } },
    { table = "audit_log", op_type = "insert", defaults = { event = "filled" }, bind = { order_id = "$0.id", status = "$0.status" } },
]
cancel = [
    { table = "orders", op_type = "update", key = ["id"], fields = ["status"], defaults = { status = "cancelled" } },
    { table = "audit_log", op_type = "insert", defaults = { event = "cancelled" }, bind = { order_id = "$0.id", status = "$0.status" } },
]
# Undo/redo step the row along its recorded versions. They take only the key —
# the values come from the history table — and write no new version, so the
# step stays reversible. Editing after an undo drops the abandoned branch.
# The bound audit_log entry works here like anywhere else.
undo = [
    { table = "orders", op_type = "undo", key = ["id"] },
    { table = "audit_log", op_type = "insert", defaults = { event = "undo" }, bind = { order_id = "$0.id", status = "$0.status" } },
]
redo = [
    { table = "orders", op_type = "redo", key = ["id"] },
    { table = "audit_log", op_type = "insert", defaults = { event = "redo" }, bind = { order_id = "$0.id", status = "$0.status" } },
]

# --- Live data services ---

[services.last_trade]
protocol = "subpub"
primary_table = "orders"
topic = "symbol"
where = "status == 'filled'"
change_log_size = 10000
access = "open"

[services.last_trade.defaults]
symbol = "_mkio_topic"
price = "0"
time = "''"

# publish values are expressions over the row (see README "Expression Language")
[services.last_trade.publish]
symbol = "symbol"
price = "IF(side == 'Buy', price, -price)"
time = "REF_TIME(_mkio_ref, fmt: '%H:%M:%S')"

# SubPub with computed topic — subscribe by "AAPL:Buy" or "MSFT:Sell"
[services.last_trade_by_side]
protocol = "subpub"
primary_table = "orders"
topic = "topic_key"
sql = "SELECT *, symbol || ':' || side AS topic_key FROM orders"
where = "status == 'filled'"
access = "open"

[services.last_trade_by_side.publish]
symbol = "symbol"
side = "side"
price = "price"
qty = "qty"

[services.audit_feed]
protocol = "stream"
primary_table = "audit_log"
buffer_size = 10000
access = "view"

[services.all_orders]
protocol = "query"
primary_table = "orders"
filterable = ["status", "symbol"]
change_log_size = 10000
access = "view"

# --- Request-reply services ---

# Look up a single order by id
[services.order_lookup]
protocol = "reqrep"
sql = "SELECT * FROM orders WHERE id = :id"
access = "view"

# Summary stats for a symbol
[services.symbol_summary]
protocol = "reqrep"
params = { symbol = "UPPER(symbol)" }
sql = "SELECT symbol, COUNT(*) as total_orders, SUM(CASE WHEN status = 'filled' THEN 1 ELSE 0 END) as filled, SUM(CASE WHEN status = 'filled' THEN qty ELSE 0 END) as filled_qty, ROUND(AVG(CASE WHEN status = 'filled' THEN price END), 2) as avg_fill_price FROM orders WHERE symbol = :symbol GROUP BY symbol"
access = "view"

# Compute order total from client-supplied data (no DB)
[services.order_total]
protocol = "reqrep"
reply = { subtotal = "qty * price", fee = "qty * price |> (sub -> ROUND(sub * 0.001, 2))", total = "LET(sub, qty * price, ROUND(sub + sub * 0.001, 2))" }
access = "open"

# Basket total from a client-supplied array (no DB): { "items": [{"qty": 2, "price": 10}, ...] }
[services.basket_total]
protocol = "reqrep"
reply = "items |> (xs -> SUM(MAP(xs, i -> i.qty * i.price)))"
access = "open"

# Count orders by status (scalar)
[services.order_count]
protocol = "reqrep"
sql = "SELECT COUNT(*) as n FROM orders WHERE status = :status"
reply = "n ?? 0"
access = "view"

# --- Change history (from `versioned = true` on [tables.orders]) ---
#
# The history table is named by convention — "__history" + the base table
# — so a client that knows the table knows where its history lives. mkio never
# advertises it: it is absent from the _mkio table listing, and no service
# exists for it until you write one. The three below are that deliberate
# choice, each gated by its own right like anything else.

# Live audit tape: the 50 most recent versions, then every new one as it lands.
[services.order_history]
protocol = "query"
primary_table = "orders__history"
sql = "SELECT * FROM orders__history ORDER BY _mkio_ref DESC LIMIT 50"
filterable = ["id", "status", "_mkio_op", "_mkio_user"]
change_log_size = 10000
access = "audit"

# Every recorded version of one order, oldest first. The live row's own
# _mkio_version says which of these it currently sits on; anything above that
# is a redo entry left behind by an undo.
[services.order_versions]
protocol = "reqrep"
sql = "SELECT * FROM orders__history WHERE id = :id ORDER BY _mkio_version"
access = "audit"

[services.order_versions.reply]
version = "_mkio_version"
op = "_mkio_op"
time = "REF_TIME(_mkio_ref, fmt: '%Y-%m-%d %H:%M:%S')"
user = "_mkio_user ?? '(system)'"
side = "side"
symbol = "symbol"
qty = "qty"
price = "price"
status = "status"

# Where a row sits in its own history: the version it is on, and the highest
# version recorded for it. `current` is null once the row has been undone away
# — its versions survive, so redo can rebuild it. `top` is null when the row
# has no history at all. Reading this is what tells the UI whether undo and
# redo are available, rather than guessing from the last message it saw.
[services.order_state]
protocol = "reqrep"
sql = "SELECT (SELECT _mkio_version FROM orders WHERE id = :id) AS current, MAX(_mkio_version) AS top FROM orders__history WHERE id = :id"
access = "audit"

# Housekeeping. History grows without bound, so archive it periodically —
# note that archiving old versions is what removes undo depth. Redo state is
# transient: `mkio dbupdate` discards it unless you pass --keep-redo.
#   mkio archive server.toml --older-than 90d --out ./archive --dry-run
#   mkio archive server.toml --older-than 90d --out ./archive --delete

# --- Static file serving ---

[static]
"/" = "./static"
